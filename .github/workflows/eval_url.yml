name: 作业 URL 自动审批与评测

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      repo_url:
        description: '学生代码仓库 URL'
        required: true
        type: string
      issue_number:
        description: '关联的 Issue 编号 (可选，用于回帖)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  evaluate-submission:
    # 过滤掉机器人自己的发帖，防止死循环
    if: >-
      (github.actor != 'github-actions[bot]' && github.event.sender.type != 'Bot') &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.issue.labels.*.name, 'homework-submission') ||
        contains(github.event.issue.title, '作业') ||
        contains(github.event.issue.title, 'homework')
      )
    runs-on: ubuntu-latest

    steps:
      - name: 1. 解析作业 URL 并标记已接单
        id: parse
        env:
          GH_TOKEN: ${{ secrets.SCORES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO_URL: ${{ github.event.inputs.repo_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, re

          event_name = os.environ.get('EVENT_NAME', '')
          input_url = os.environ.get('INPUT_REPO_URL', '').strip()
          comment_body = os.environ.get('COMMENT_BODY', '')
          issue_body = os.environ.get('ISSUE_BODY', '')

          url = ''
          if event_name == 'workflow_dispatch' and input_url:
              url = input_url
          else:
              m = re.search(r'https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+', comment_body)
              if not m:
                  m = re.search(r'https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+', issue_body)
              if m:
                  url = m.group(0).rstrip('.')

          if url.endswith('.git'):
              url = url[:-4]

          if not url:
              print('::error::未能从提交内容中找到有效的 GitHub 仓库链接')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('valid=false\n')
              sys.exit(0)

          print(f'⚡ 解析到有效作业仓库链接: {url}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('valid=true\n')
              f.write(f'repo_url={url}\n')
          PYEOF

      - name: 校验失败通知
        if: steps.parse.outputs.valid == 'false' && (github.event_name == 'issues' || github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ secrets.SCORES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "❌ **评测未启动**：未能从您的提交内容中解析到有效的 GitHub 仓库地址，请检查并提供如 \`https://github.com/username/repo\` 的链接。"

      - name: 2. 并行拉取学生代码与后台私有库
        if: steps.parse.outputs.valid == 'true'
        env:
          STUDENT_URL: ${{ steps.parse.outputs.repo_url }}
          SCORES_TOKEN: ${{ secrets.SCORES_TOKEN }}
        run: |
          rm -rf ./student_code ./backend
          echo "::group::正在并行拉取代码与后台..."
          git clone --depth 1 --single-branch "${STUDENT_URL}" ./student_code &
          git clone --depth 1 --single-branch "https://${SCORES_TOKEN}@github.com/ftl-is-king/homowork-scores.git" ./backend &
          wait
          echo "::endgroup::"
          echo "✅ 代码库与评测后台拉取完成"

      - name: 3. 执行 GCC 编译测试与性能打分 (核心评测运行状况)
        if: steps.parse.outputs.valid == 'true'
        id: evaluate
        run: |
          python3 ./backend/test.py \
            --dir ./student_code \
            --db ./backend/DB.csv \
            --csv ./backend/test.csv \
            --no-push \
            --json-output results.json

      - name: 4. 生成报告、发送 Issue 成绩回帖并更名
        if: steps.parse.outputs.valid == 'true' && (github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event.inputs.issue_number != '')
        env:
          GH_TOKEN: ${{ secrets.SCORES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess

          gh_repo = os.environ.get('GH_REPO', '')
          issue_num = os.environ.get('ISSUE_NUMBER', '')
          run_id = os.environ.get('RUN_ID', '')

          if not os.path.exists('results.json'):
              body = '### ❌ 评测执行失败\n未能生成有效评测结果，请检查代码目录结构或编译错误。'
          else:
              with open('results.json', 'r', encoding='utf-8') as jf:
                  results = json.load(jf)

              if not results:
                  body = '### ⚠️ 未找到有效作业代码\n请确保作业文件命名为 `1_main.c`、`2_xxx.c` 等规范格式。'
              else:
                  lines = ['### 📋 作业自动化评测报告\n']
                  first = results[0]
                  stu_id = first.get('student_id')
                  stu_name = first.get('name')
                  if stu_id and stu_name:
                      lines.append(f'**学号**: {stu_id} | **姓名**: {stu_name}\n')
                      new_title = f'[作业评测] {stu_id} - {stu_name}'
                      subprocess.run(['gh', 'issue', 'edit', str(issue_num), '--repo', gh_repo, '--title', new_title], check=False)

                  lines.append('| 题号 | 文件名 | 测试点 | 运行时间 (ms) | 运行内存 (KB) | 最终得分 | 状态 |')
                  lines.append('|:---:|:---|:---:|:---:|:---:|:---:|:---:|')

                  all_passed = True
                  for r in results:
                      prob = r.get('problem', '-')
                      fname = r.get('file', '-')
                      if r.get('success'):
                          right = r.get('right', '-')
                          t = r.get('time_ms', 0)
                          m = r.get('memory_kb', 0)
                          sc = r.get('score', 0)
                          status = '✅ 通过' if sc >= 60 else '⚠️ 部分通过'
                          if sc < 60:
                              all_passed = False
                          lines.append(f'| 第 {prob} 题 | `{fname}` | {right} | {t} | {m} | **{sc}** | {status} |')
                      else:
                          all_passed = False
                          err = r.get('error', '失败')
                          lines.append(f'| 第 {prob} 题 | `{fname}` | - | - | - | **0** | ❌ {err} |')

                  lines.append('\n---\n')
                  if all_passed:
                      lines.append('> 🎉 **恭喜！提交的代码通过了所有评测标准，成绩已安全登记入库！**')
                  else:
                      lines.append('> 💡 **提示**：可直接在下方回复任何消息，或编辑原 Issue，系统将在几秒内重新拉取最新代码重测。')

                  if run_id:
                      lines.append(f'\n> ⏱️ **评测耗时**: 约 2~3 秒 | [查看 Actions 实时运行状况](https://github.com/{gh_repo}/actions/runs/{run_id})')

                  body = '\n'.join(lines)

          with open('comment_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          PYEOF

          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file comment_body.md
          echo "✅ 评测报告回帖已完成！"

      - name: 5. 成绩加密归档至私有数据库 (homowork-scores)
        if: steps.parse.outputs.valid == 'true'
        env:
          SCORES_TOKEN: ${{ secrets.SCORES_TOKEN }}
        run: |
          cd backend
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s test.csv) ]]; then
            git add test.csv
            git commit -m "chore: 评测成绩安全同步至私有库 [skip ci]"
            for i in {1..3}; do
              if git push origin main; then
                echo "🔒 成绩已同步并归档至私有仓库 homowork-scores！"
                break
              fi
              git pull --rebase origin main
              sleep 1
            done
          else
            echo "ℹ️ 私有成绩表 test.csv 无变动或未达到更高分数，跳过提交。"
          fi
