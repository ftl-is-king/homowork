name: 作业 URL 自动审批与评测

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      repo_url:
        description: '学生代码仓库 URL'
        required: true
        type: string
      issue_number:
        description: '关联的 Issue 编号 (可选，用于回帖)'
        required: false
        type: string

concurrency:
  group: eval-${{ github.event.issue.number || github.event.inputs.issue_number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  evaluate-submission:
    # 过滤掉机器人自身发表的任何动作
    if: github.actor != 'github-actions[bot]' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: 1. 解析作业 URL 并标记已接单
        id: parse
        env:
          GH_TOKEN: ${{ secrets.SCORES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO_URL: ${{ github.event.inputs.repo_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, re, json, urllib.request

          event_name = os.environ.get('EVENT_NAME', '')
          input_url = os.environ.get('INPUT_REPO_URL', '').strip()
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')
          comment_body = os.environ.get('COMMENT_BODY', '')
          comment_id = os.environ.get('COMMENT_ID', '')
          gh_repo = os.environ.get('GH_REPO', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          issue_num = os.environ.get('ISSUE_NUMBER', '')

          # 核心防循环：如果是评论触发，只要包含任何系统提示关键词，坚决直接退出！
          if event_name == 'issue_comment':
              bot_keywords = ['评测', '报告', '❌', '📋', '⚠️', '失败', '克隆', '未启动']
              if any(k in comment_body for k in bot_keywords) or comment_body.strip().startswith('###'):
                  print('ℹ️ 检测到系统自动回复的通知或报告，立即退出以彻底杜绝死循环。')
                  sys.exit(0)

          # 校验是否为作业帖
          is_homework = ('作业' in issue_title or 'homework' in issue_title.lower() or '作业' in issue_body or event_name == 'workflow_dispatch')
          if not is_homework:
              print(f'ℹ️ 该 Issue 不是作业提交帖，跳过。')
              sys.exit(0)

          # 0. 瞬间为用户评论或 Issue 点亮接单 👀 眼睛表情（秒级即时视觉反馈）
          if gh_repo and gh_token:
              try:
                  if comment_id:
                      u = f'https://api.github.com/repos/{gh_repo}/issues/comments/{comment_id}/reactions'
                  elif issue_num:
                      u = f'https://api.github.com/repos/{gh_repo}/issues/{issue_num}/reactions'
                  else:
                      u = ''
                  if u:
                      data = json.dumps({'content': 'eyes'}).encode('utf-8')
                      headers = {'User-Agent': 'Actions', 'Authorization': f'token {gh_token}', 'Accept': 'application/vnd.github.v3+json'}
                      urllib.request.urlopen(urllib.request.Request(u, data=data, headers=headers), timeout=5)
              except Exception:
                  pass

          # 提取学生作业仓库 URL（优先从评论匹配，其次从 Issue 正文匹配，排除 homowork 评测主库自身）
          target_url = ''
          if event_name == 'workflow_dispatch' and input_url:
              target_url = input_url
          else:
              matches = re.findall(r'https://github\.com/([a-zA-Z0-9_.-]+)/([a-zA-Z0-9_.-]+)', comment_body)
              if not matches:
                  matches = re.findall(r'https://github\.com/([a-zA-Z0-9_.-]+)/([a-zA-Z0-9_.-]+)', issue_body)
              for owner, repo in matches:
                  clean_repo = repo.rstrip('.')
                  if clean_repo.endswith('.git'):
                      clean_repo = clean_repo[:-4]
                  if clean_repo != 'homowork' and clean_repo != 'homowork-scores':
                      target_url = f'https://github.com/{owner}/{clean_repo}'
                      break

          if target_url.endswith('.git'):
              target_url = target_url[:-4]

          # 检查是否误提交了默认占位符模板链接
          if 'your-username' in target_url or 'your-repo' in target_url:
              print('❌ 学生提交了未修改的默认模板占位链接')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('valid=false\n')
                  f.write('error_reason=template_url\n')
              sys.exit(0)

          if not target_url:
              print('::error::未能从提交内容中找到有效的学生作业代码仓库链接')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('valid=false\n')
                  f.write('error_reason=no_url\n')
              sys.exit(0)

          print(f'⚡ 解析到有效学生作业仓库链接: {target_url}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('valid=true\n')
              f.write(f'repo_url={target_url}\n')
          PYEOF

      - name: 校验失败通知
        if: steps.parse.outputs.valid == 'false' && (github.event_name == 'issues' || github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ secrets.SCORES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REASON: ${{ steps.parse.outputs.error_reason }}
        run: |
          if [ "$REASON" = "template_url" ]; then
            MSG="### ❌ 提交未启动：占位符链接未修改
您提交的内容中包含默认模板链接 \`https://github.com/your-username/your-repo\`。
请编辑本 Issue，将其替换为你存放作业代码的**真实公开 GitHub 仓库网址**后保存。"
          else
            MSG="### ❌ 提交未启动：未找到有效链接
未能从您的提交内容中解析到有效的 GitHub 仓库地址，请提供如 \`https://github.com/username/repo\` 的公开仓库链接。"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$MSG"

      - name: 2. 并行拉取学生代码与后台私有库
        if: steps.parse.outputs.valid == 'true'
        env:
          STUDENT_URL: ${{ steps.parse.outputs.repo_url }}
          SCORES_TOKEN: ${{ secrets.SCORES_TOKEN }}
        run: |
          rm -rf ./student_code ./backend
          echo "::group::正在拉取评测后台与学生代码..."
          git clone --depth 1 --single-branch --no-tags "https://${SCORES_TOKEN}@github.com/ftl-is-king/homowork-scores.git" ./backend
          if ! git clone --depth 1 --single-branch --no-tags "${STUDENT_URL}" ./student_code; then
            echo "CLONE_FAILED=true" >> $GITHUB_ENV
            echo "❌ 学生仓库克隆失败"
          else
            echo "CLONE_FAILED=false" >> $GITHUB_ENV
            echo "✅ 学生仓库克隆成功"
          fi
          echo "::endgroup::"

      - name: 3. 执行 GCC 编译测试与性能打分 (核心评测运行状况)
        if: steps.parse.outputs.valid == 'true' && env.CLONE_FAILED != 'true'
        id: evaluate
        run: |
          python3 ./backend/test.py \
            --dir ./student_code \
            --db ./backend/DB.csv \
            --csv ./backend/test.csv \
            --no-push \
            --json-output results.json

      - name: 4. 生成报告、发送 Issue 成绩回帖并更名
        if: steps.parse.outputs.valid == 'true' && (github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event.inputs.issue_number != '')
        env:
          GH_TOKEN: ${{ secrets.SCORES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
          CLONE_FAILED: ${{ env.CLONE_FAILED }}
          STUDENT_URL: ${{ steps.parse.outputs.repo_url }}
        run: |
          python3 - << 'PYEOF'
          import json, os, urllib.request
          from datetime import datetime, timedelta

          gh_repo = os.environ.get('GH_REPO', '')
          gh_token = os.environ.get('GH_TOKEN', '')
          issue_num = os.environ.get('ISSUE_NUMBER', '')
          run_id = os.environ.get('RUN_ID', '')
          comment_id = os.environ.get('COMMENT_ID', '')
          clone_failed = os.environ.get('CLONE_FAILED', '')
          student_url = os.environ.get('STUDENT_URL', '')
          submit_time = (datetime.now() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S')

          api_headers = {
              'User-Agent': 'Actions',
              'Authorization': f'token {gh_token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          if clone_failed == 'true':
              body = f"### ❌ 代码仓库克隆失败\n无法拉取代码仓库：`{student_url}`。\n\n**可能原因**：\n1. 该仓库不是 **Public（公开）** 仓库（请进入该仓库 Settings -> Change visibility 改为 Public）；\n2. 仓库 URL 拼写有误或已被删除。"
              stu_id = None
              stu_name = None
          elif not os.path.exists('results.json'):
              body = '### ❌ 评测执行失败\n未能生成有效评测结果，请检查代码编译错误或目录结构。'
              stu_id = None
              stu_name = None
          else:
              with open('results.json', 'r', encoding='utf-8') as jf:
                  results = json.load(jf)

              if not results:
                  body = '### ⚠️ 未找到有效作业代码\n请确保代码文件命名为 `1_main.c`、`2_xxx.c` 等规范格式。'
                  stu_id = None
                  stu_name = None
              else:
                  lines = ['### 📋 作业自动化评测报告\n']
                  first = results[0]
                  stu_id = first.get('student_id')
                  stu_name = first.get('name')

                  lines.append('| 题号 | 文件名 | 测试点 | 运行时间 (ms) | 运行内存 (KB) | 最终得分 | 状态 | 提交时间 |')
                  lines.append('|:---:|:---|:---:|:---:|:---:|:---:|:---:|:---:|')

                  all_passed = True
                  for r in results:
                      prob = r.get('problem', '-')
                      fname = r.get('file', '-')
                      t_str = r.get('submit_time') or submit_time
                      if r.get('success'):
                          right = r.get('right', '-')
                          t = r.get('time_ms', 0)
                          m = r.get('memory_kb', 0)
                          sc = r.get('score', 0)
                          status = '✅ 通过' if sc >= 60 else '⚠️ 部分通过'
                          if sc < 60:
                              all_passed = False
                          lines.append(f'| 第 {prob} 题 | `{fname}` | {right} | {t} | {m} | **{sc}** | {status} | {t_str} |')
                      else:
                          all_passed = False
                          err = r.get('error', '失败')
                          lines.append(f'| 第 {prob} 题 | `{fname}` | - | - | - | **0** | ❌ {err} | {t_str} |')

                  lines.append('\n---\n')
                  if all_passed:
                      lines.append('> 🎉 **恭喜！提交的代码通过了所有评测标准，成绩已安全登记入库！**')
                  else:
                      lines.append('> 💡 **提示**：可直接在下方回复任何消息（如“申请重测”），系统将立刻在楼下回复最新评测成绩。')

                  if run_id:
                      lines.append(f'\n> ⏱️ **评测耗时**: 约 2~3 秒 | [查看 Actions 实时运行状况](https://github.com/{gh_repo}/actions/runs/{run_id})')

                  body = '\n'.join(lines)

          # 1. 保护隐私：标题统一标注为 [作业评测已完成]
          if issue_num and gh_repo and gh_token:
              try:
                  t_url = f'https://api.github.com/repos/{gh_repo}/issues/{issue_num}'
                  t_data = json.dumps({'title': '[作业评测已完成]'}).encode('utf-8')
                  urllib.request.urlopen(urllib.request.Request(t_url, data=t_data, headers=api_headers, method='PATCH'), timeout=5)
              except Exception as e:
                  print('Update title error:', e)

          # 2. 发表回复
          try:
              post_url = f'https://api.github.com/repos/{gh_repo}/issues/{issue_num}/comments'
              post_data = json.dumps({'body': body}).encode('utf-8')
              urllib.request.urlopen(urllib.request.Request(post_url, data=post_data, headers=api_headers), timeout=10)
              print('✅ 评测报告新回复已发表！')
          except Exception as e:
              print('Post comment error:', e)

          # 3. 为用户刚才的评论点亮 rocket 🚀 表情
          if comment_id and gh_repo and gh_token:
              try:
                  rk_url = f'https://api.github.com/repos/{gh_repo}/issues/comments/{comment_id}/reactions'
                  rk_data = json.dumps({'content': 'rocket'}).encode('utf-8')
                  urllib.request.urlopen(urllib.request.Request(rk_url, data=rk_data, headers=api_headers), timeout=5)
              except Exception:
                  pass
          PYEOF

      - name: 5. 成绩加密归档至私有数据库 (homowork-scores)
        if: steps.parse.outputs.valid == 'true' && env.CLONE_FAILED != 'true'
        run: |
          cd backend
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s test.csv) ]]; then
            git add test.csv
            git commit -m "chore: 评测成绩安全同步至私有库 [skip ci]"
            for i in {1..3}; do
              if git push origin main; then
                echo "🔒 成绩已同步并归档至私有仓库 homowork-scores！"
                break
              fi
              git pull --rebase origin main
              sleep 1
            done
          else
            echo "ℹ️ 私有成绩表 test.csv 无变动或未达到更高分数，跳过提交。"
          fi
