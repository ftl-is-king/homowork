name: 作业 URL 自动审批与评测

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      repo_url:
        description: '学生代码仓库 URL'
        required: true
        type: string
      issue_number:
        description: '关联的 Issue 编号 (可选，用于回帖)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  evaluate-submission:
    # 过滤掉机器人自己的发帖，防止死循环
    if: >-
      (github.actor != 'github-actions[bot]' && github.event.sender.type != 'Bot') &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.issue.labels.*.name, 'homework-submission') ||
        contains(github.event.issue.title, '作业') ||
        contains(github.event.issue.title, 'homework')
      )
    runs-on: ubuntu-latest

    steps:
      - name: 秒级极速并发评测与直连回帖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SCORES_TOKEN: ${{ secrets.SCORES_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO_URL: ${{ github.event.inputs.repo_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - << 'EOF'
          import os, sys, re, json, urllib.request, subprocess, shutil

          gh_token = os.environ.get('GH_TOKEN', '')
          gh_repo = os.environ.get('GH_REPO', '')
          scores_token = os.environ.get('SCORES_TOKEN', '')
          event_name = os.environ.get('EVENT_NAME', '')
          issue_num = os.environ.get('ISSUE_NUMBER', '')
          input_url = os.environ.get('INPUT_REPO_URL', '').strip()
          comment_body = os.environ.get('COMMENT_BODY', '')
          issue_body = os.environ.get('ISSUE_BODY', '')

          api_headers = {
              'User-Agent': 'Actions-Auto-Eval',
              'Authorization': f'token {gh_token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def post_comment(text):
              if not issue_num or not gh_repo or not gh_token:
                  return
              try:
                  url = f'https://api.github.com/repos/{gh_repo}/issues/{issue_num}/comments'
                  data = json.dumps({'body': text}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers=api_headers)
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print('Post comment error:', e)

          def edit_title(new_title):
              if not issue_num or not gh_repo or not gh_token:
                  return
              try:
                  url = f'https://api.github.com/repos/{gh_repo}/issues/{issue_num}'
                  data = json.dumps({'title': new_title}).encode('utf-8')
                  req = urllib.request.Request(url, data=data, headers=api_headers, method='PATCH')
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print('Edit title error:', e)

          # 1. 解析目标代码仓库 URL
          target_url = ''
          if event_name == 'workflow_dispatch' and input_url:
              target_url = input_url
          else:
              m = re.search(r'https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+', comment_body)
              if not m:
                  m = re.search(r'https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+', issue_body)
              if m:
                  target_url = m.group(0).rstrip('.')

          if target_url.endswith('.git'):
              target_url = target_url[:-4]

          if not target_url:
              print('❌ 未在提交内容中找到有效的 GitHub 仓库 URL')
              post_comment('❌ **评测未启动**：未能从您的提交中解析到有效的 GitHub 仓库地址，请提供如 `https://github.com/username/repo` 的公开仓库链接。')
              sys.exit(0)

          print(f'⚡ 正在极速评测目标仓库: {target_url}')

          # 2. 并发浅克隆学生代码与私有后台引擎
          shutil.rmtree('./student_code', ignore_errors=True)
          shutil.rmtree('./backend', ignore_errors=True)

          backend_url = f'https://{scores_token}@github.com/ftl-is-king/homowork-scores.git'
          p_stu = subprocess.Popen(['git', 'clone', '--depth', '1', '--single-branch', target_url, './student_code'])
          p_bk = subprocess.Popen(['git', 'clone', '--depth', '1', '--single-branch', backend_url, './backend'])
          p_stu.wait()
          p_bk.wait()

          if p_stu.returncode != 0:
              post_comment(f'❌ **克隆失败**：无法拉取仓库 `{target_url}`，请确认该仓库为 **Public（公开）** 仓库。')
              sys.exit(0)

          if p_bk.returncode != 0:
              post_comment('❌ **后台错误**：未能拉取私有后台评测引擎，请联系管理员核查密钥配置。')
              sys.exit(0)

          # 3. 执行纯标准库极速评测引擎
          test_cmd = [
              'python3', './backend/test.py',
              '--dir', './student_code',
              '--db', './backend/DB.csv',
              '--csv', './backend/test.csv',
              '--no-push',
              '--json-output', 'results.json'
          ]
          res_proc = subprocess.run(test_cmd, capture_output=True, text=True)
          print(res_proc.stdout)
          if res_proc.stderr:
              print(res_proc.stderr)

          # 4. 生成报告并极速回帖 (直连 REST API，耗时 < 200ms)
          if not os.path.exists('results.json'):
              post_comment('### ❌ 评测执行失败\n未能生成评测结果，请检查代码编译错误或目录结构。')
              sys.exit(0)

          with open('results.json', 'r', encoding='utf-8') as jf:
              results = json.load(jf)

          if not results:
              post_comment('### ⚠️ 未找到有效作业代码\n请确保代码文件命名为 `1_main.c`、`2_xxx.c` 等规范格式。')
              sys.exit(0)

          lines = ['### 📋 作业自动化评测报告\n']
          first = results[0]
          stu_id = first.get('student_id')
          stu_name = first.get('name')

          if stu_id and stu_name:
              lines.append(f'**学号**: {stu_id} | **姓名**: {stu_name}\n')
              # 异步修改 Issue 标题
              edit_title(f'[作业评测] {stu_id} - {stu_name}')

          lines.append('| 题号 | 文件名 | 测试点 | 运行时间 (ms) | 运行内存 (KB) | 最终得分 | 状态 |')
          lines.append('|:---:|:---|:---:|:---:|:---:|:---:|:---:|')

          all_passed = True
          for r in results:
              prob = r.get('problem', '-')
              fname = r.get('file', '-')
              if r.get('success'):
                  right = r.get('right', '-')
                  t = r.get('time_ms', 0)
                  m = r.get('memory_kb', 0)
                  sc = r.get('score', 0)
                  status = '✅ 通过' if sc >= 60 else '⚠️ 部分通过'
                  if sc < 60:
                      all_passed = False
                  lines.append(f'| 第 {prob} 题 | `{fname}` | {right} | {t} | {m} | **{sc}** | {status} |')
              else:
                  all_passed = False
                  err = r.get('error', '失败')
                  lines.append(f'| 第 {prob} 题 | `{fname}` | - | - | - | **0** | ❌ {err} |')

          lines.append('\n---\n')
          if all_passed:
              lines.append('> 🎉 **恭喜！提交的代码通过了所有评测标准，成绩已安全登记入库！**')
          else:
              lines.append('> 💡 **提示**：可直接在下方回复任何消息，或编辑原 Issue，系统将在几秒内重新拉取最新代码重测。')

          # 立即回帖！
          post_comment('\n'.join(lines))
          print('✅ 回帖完成！')

          # 5. 后台静默推送更新成绩至私有仓库
          subprocess.run(['git', '-C', './backend', 'config', 'user.name', 'github-actions[bot]'], check=False)
          subprocess.run(['git', '-C', './backend', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], check=False)
          subprocess.run(['git', '-C', './backend', 'add', 'test.csv'], check=False)
          subprocess.run(['git', '-C', './backend', 'commit', '-m', 'chore: 自动同步成绩 [skip ci]'], check=False)
          for _ in range(3):
              push_r = subprocess.run(['git', '-C', './backend', 'push', 'origin', 'main'], capture_output=True, text=True)
              if push_r.returncode == 0:
                  print('🔒 成绩已同步至私有库！')
                  break
              subprocess.run(['git', '-C', './backend', 'pull', '--rebase', 'origin', 'main'], check=False)

          print('⚡ 全流程秒级执行完毕！')
          EOF
