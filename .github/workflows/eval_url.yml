name: 作业 URL 自动审批与评测

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      repo_url:
        description: '学生代码仓库 URL'
        required: true
        type: string
      issue_number:
        description: '关联的 Issue 编号 (可选，用于回帖)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  evaluate-submission:
    # 过滤掉机器人自己的发帖，防止死循环
    if: >-
      (github.actor != 'github-actions[bot]' && github.event.sender.type != 'Bot') &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.issue.labels.*.name, 'homework-submission') ||
        contains(github.event.issue.title, '作业') ||
        contains(github.event.issue.title, 'homework')
      )
    runs-on: ubuntu-22.04

    steps:
      - name: 解析提交信息与仓库 URL
        id: parse_submission
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO_URL: ${{ github.event.inputs.repo_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 -c "
          import os, re, sys

          event_name = os.environ.get('EVENT_NAME', '')
          if event_name == 'workflow_dispatch':
              url = os.environ.get('INPUT_REPO_URL', '').strip()
          else:
              comment_body = os.environ.get('COMMENT_BODY', '')
              issue_body = os.environ.get('ISSUE_BODY', '')
              # 优先从评论中匹配，若评论没有则使用 Issue 正文中的链接
              match = re.search(r'https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+', comment_body)
              if not match:
                  match = re.search(r'https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+', issue_body)
              url = match.group(0).rstrip('.') if match else ''

          if not url:
              print('❌ 未在提交内容中找到有效的 GitHub 仓库 URL')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('valid=false\n')
              sys.exit(0)

          if url.endswith('.git'):
              url = url[:-4]

          print(f'⚡ 解析到作业仓库 URL: {url}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('valid=true\n')
              f.write(f'repo_url={url}\n')
          "

      - name: 校验失败通知
        if: steps.parse_submission.outputs.valid == 'false' && (github.event_name == 'issues' || github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ **评测未启动**：未能从您的提交内容中解析到有效的 GitHub 仓库地址，请检查并提供如 \`https://github.com/username/repo\` 的链接。"

      - name: 并行浅克隆学生代码与私有后台 (极速并发)
        if: steps.parse_submission.outputs.valid == 'true'
        env:
          SCORES_TOKEN: ${{ secrets.SCORES_TOKEN }}
        run: |
          STUDENT_URL="${{ steps.parse_submission.outputs.repo_url }}"
          rm -rf ./student_code ./backend
          # 并行后台浅克隆，网络延迟减半
          git clone --depth 1 --single-branch "${STUDENT_URL}" ./student_code &
          git clone --depth 1 --single-branch "https://${SCORES_TOKEN}@github.com/ftl-is-king/homowork-scores.git" ./backend &
          wait
          echo "⚡ 代码与后台引擎并行拉取完成"

      - name: 执行后台秒级评测
        if: steps.parse_submission.outputs.valid == 'true'
        id: run_test
        run: |
          python3 ./backend/test.py \
            --dir ./student_code \
            --db ./backend/DB.csv \
            --csv ./backend/test.csv \
            --no-push \
            --json-output results.json

      - name: 生成评测报告、回帖并自动修正 Issue 标题
        if: steps.parse_submission.outputs.valid == 'true' && (github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event.inputs.issue_number != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          python3 -c "
          import json, os, subprocess

          issue_num = os.environ.get('ISSUE_NUMBER')
          if not os.path.exists('results.json'):
              body = '### ❌ 评测执行失败\n未能生成有效评测结果，请检查代码目录结构或编译错误。'
          else:
              with open('results.json', 'r', encoding='utf-8') as f:
                  results = json.load(f)

              if not results:
                  body = '### ⚠️ 未找到有效作业代码\n请确保作业文件命名为 \`1_main.c\`、\`2_xxx.c\` 等规范格式。'
              else:
                  lines = ['### 📋 作业自动化评测报告\n']
                  first = results[0]
                  stu_id = first.get('student_id')
                  stu_name = first.get('name')
                  if stu_id and stu_name:
                      lines.append(f'**学号**: {stu_id} | **姓名**: {stu_name}\n')
                      # 自动修改 Issue 标题为 [作业评测] 学号 - 姓名
                      new_title = f'[作业评测] {stu_id} - {stu_name}'
                      subprocess.run(['gh', 'issue', 'edit', str(issue_num), '--title', new_title], check=False)

                  lines.append('| 题号 | 文件名 | 测试点 | 运行时间 (ms) | 运行内存 (KB) | 最终得分 | 状态 |')
                  lines.append('|:---:|:---|:---:|:---:|:---:|:---:|:---:|')

                  all_passed = True
                  total_score = 0
                  for r in results:
                      prob = r.get('problem', '-')
                      fname = r.get('file', '-')
                      if r.get('success'):
                          right = r.get('right', '-')
                          t = r.get('time_ms', 0)
                          m = r.get('memory_kb', 0)
                          sc = r.get('score', 0)
                          total_score += sc
                          status = '✅ 通过' if sc >= 60 else '⚠️ 部分通过'
                          if sc < 60:
                              all_passed = False
                          lines.append(f'| 第 {prob} 题 | \`{fname}\` | {right} | {t} | {m} | **{sc}** | {status} |')
                      else:
                          all_passed = False
                          err = r.get('error', '失败')
                          lines.append(f'| 第 {prob} 题 | \`{fname}\` | - | - | - | **0** | ❌ {err} |')

                  lines.append('\n---\n')
                  if all_passed:
                      lines.append('> 🎉 **恭喜！提交的代码通过了所有评测标准，成绩已安全登记入库！**')
                  else:
                      lines.append('> 💡 **提示**：可直接在下方回复任何消息，或编辑原 Issue，系统将在几秒内重新拉取最新代码重测。')

                  body = '\n'.join(lines)

          with open('comment_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          "
          gh issue comment "$ISSUE_NUMBER" --body-file comment_body.md

      - name: 将最新成绩推送到私有后台 (homowork-scores)
        if: steps.parse_submission.outputs.valid == 'true'
        env:
          SCORES_TOKEN: ${{ secrets.SCORES_TOKEN }}
        run: |
          cd backend
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s test.csv) ]]; then
            git add test.csv
            git commit -m "chore: 评测成绩安全同步至私有库 [skip ci]"
            for i in {1..3}; do
              git pull --rebase origin main
              if git push origin main; then
                echo "🔒 成绩已安全加密推送到私有仓库 homowork-scores！"
                break
              fi
              sleep 1
            done
          fi
